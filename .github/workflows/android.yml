name: Android APK

# Build de l'app Android (sous-dossier android/) : tests unitaires + APK debug.
# Déclenché sur les pushes et PR qui touchent android/, et manuellement.
on:
  push:
    branches: ["main"]
    paths: ["android/**"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests & APK debug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Tests unitaires
        run: ./gradlew test --no-daemon

      - name: Build APK debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mindlog-id-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload rapports de tests (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/**/build/reports/tests/
          if-no-files-found: ignore
