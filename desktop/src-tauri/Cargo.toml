[package]
name = "mindlog-id-desktop"
version = "0.1.0"
description = "Client desktop de mindlog · id (wrapper Tauri de l'app web)."
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mindlog_id_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
